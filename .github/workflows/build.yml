name: Build & Package Predator Sync

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Verification & Audit Test Suites
        run: |
          python test_component_audit.py
          python test_tray_longevity.py
          python test_keyboard_projection.py
          python test_physical_brightness.py
          python test_updater.py

      - name: Build Standalone Application & Setup Wizard
        run: |
          python build_exe.py

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MusicalPredator-Windows-x64
          path: |
            dist/MusicalPredator-Setup.exe
            dist/MusicalPredator.exe
            dist/MusicalPredator-v1.1.0-Windows-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MusicalPredator ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/MusicalPredator-Setup.exe
            dist/MusicalPredator.exe
            dist/MusicalPredator-v1.1.0-Windows-x64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
