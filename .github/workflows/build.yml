name: Build & Package Predator Sync

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Component Audit & Verification Tests
        run: |
          python test_component_audit.py

      - name: Build Standalone Application & Setup Wizard
        run: |
          python build_exe.py

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PredatorSync-Windows-x64
          path: |
            dist/PredatorSync-Setup.exe
            dist/PredatorSync.exe
            dist/PredatorSync-v1.0.0-Windows-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PredatorSync-Setup.exe
            dist/PredatorSync.exe
            dist/PredatorSync-v1.0.0-Windows-x64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
